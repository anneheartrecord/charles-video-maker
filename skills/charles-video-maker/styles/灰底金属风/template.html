<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#e6e9ee;overflow:hidden}canvas{display:block}</style>
</head><body><canvas id="c"></canvas>
<script>
// 压垮你的，真的是最后那一下吗？ —— render(t) only; timeline mirrors audio/timeline.json
const Q = new URLSearchParams(location.search), COVER = Q.get('cover') === '1';
const cv = document.getElementById('c'), g = cv.getContext('2d');
const VW = innerWidth, VH = innerHeight; cv.width = VW; cv.height = VH;
const W = COVER ? 1080 : 1920, H = COVER ? 1440 : 1080;
const SANS = '"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif';
const SERIF = '"Songti SC","STSong","Noto Serif CJK SC","Source Han Serif SC",serif';
const C = { ink: '#1c2027', grey: '#6b7280', light: '#9aa1ac', blue: '#2856a3', red: '#c62f3a', steelD: '#4f5764', steel: '#9aa3af', steelL: '#eef1f5' };
const TL = { climax: [16.8, 79.2], bends: [1.2, 1.8, 2.4, 3.0, 3.6, 4.2, 4.8, 5.4, 6.0, 6.6, 7.2, 7.8, 8.4], snap: 9.0,
  pulses: Array.from({ length: 16 }, (_, k) => 21.6 + k * 1.2), jet: 50.4, crash1: 55.8, crash2: 57.0,
  tank: 60.0, tankEnd: 69.6, half2: 74.4, stress: [87.6, 88.8, 90.0, 91.2, 92.4, 93.6, 94.8, 96.0], split: 100.8, total: 117.6 };
const STRESS = ['加班到深夜', '一条已读不回', '又被比较了一次', '通勤两小时', '失眠到三点', '一句「你怎么又这样」', '月底的账单', '一件小事'];

// ---------- math ----------
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, k) => a + (b - a) * k;
const ss = (a, b, x) => { const k = clamp((x - a) / (b - a)); return k * k * (3 - 2 * k); };
const eo = k => 1 - Math.pow(1 - clamp(k), 3);
function spring(x, w = 15, z = .72) { if (x <= 0) return 0; const wd = w * Math.sqrt(1 - z * z);
  return 1 - Math.exp(-z * w * x) * (Math.cos(wd * x) + (z * w / wd) * Math.sin(wd * x)); }
function rnd(s) { s = Math.sin(s * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); }
const win = (t, a, b, f = .25) => clamp(Math.min((t - a) / f, (b - t) / f));

// ---------- text: [red] {blue} ----------
function segs(s) { const out = []; let cur = '', col = null; const map = { '[': C.red, '{': C.blue };
  for (const ch of s) { if (map[ch]) { if (cur) out.push([cur, col]); cur = ''; col = map[ch]; }
    else if (']}'.includes(ch)) { if (cur) out.push([cur, col]); cur = ''; col = null; } else cur += ch; }
  if (cur) out.push([cur, col]); return out; }
function txt(s, x, y, size, col = C.ink, align = 'center', weight = 600, a = 1, font = SANS) {
  if (a <= 0) return 0; g.save(); g.globalAlpha *= a; g.font = `${weight} ${size}px ${font}`; g.textBaseline = 'middle';
  const sg = segs(s); const w = sg.reduce((p, [t]) => p + g.measureText(t).width, 0);
  let x0 = align === 'center' ? x - w / 2 : align === 'right' ? x - w : x;
  for (const [t, c] of sg) { g.fillStyle = c || col; g.fillText(t, x0, y); x0 += g.measureText(t).width; }
  g.restore(); return w;
}
function caption(t, s, a, b, y = 960, size = 54) {
  const v = win(t, a, b, .2); if (v <= 0) return; const dy = 14 * (1 - spring(t - a, 20, .8));
  txt(s, W / 2, y + dy, size, C.ink, 'center', 600, v);
}
function titleBar() {
  g.save(); g.fillStyle = 'rgba(255,255,255,.55)'; g.fillRect(0, 0, W, 108);
  g.fillStyle = C.red; g.fillRect(72, 32, 7, 44);
  txt('压垮你的，真的是[最后那一下]吗？', 100, 55, 44, C.ink, 'left', 700); g.restore();
}
function sourceTag(s, a) { txt(s, W - 60, H - 36, 22, C.light, 'right', 500, a); }

// ---------- metal tube ----------
function tube(pts, w, a = 1) {
  g.save(); g.globalAlpha *= a; g.lineJoin = 'round'; g.lineCap = 'round';
  const path = () => { g.beginPath(); pts.forEach(([x, y], i) => i ? g.lineTo(x, y) : g.moveTo(x, y)); };
  g.shadowColor = 'rgba(30,35,45,.28)'; g.shadowBlur = w * .9; g.shadowOffsetY = w * .5;
  path(); g.strokeStyle = C.steelD; g.lineWidth = w; g.stroke(); g.shadowColor = 'transparent';
  path(); g.strokeStyle = C.steel; g.lineWidth = w * .68; g.stroke();
  g.translate(0, -w * .18); path(); g.strokeStyle = C.steelL; g.lineWidth = w * .2; g.stroke();
  g.restore();
}
function heat(x, y, r, a) { if (a <= 0) return; const rg = g.createRadialGradient(x, y, 0, x, y, r);
  rg.addColorStop(0, `rgba(222,60,60,${.55 * a})`); rg.addColorStop(1, 'rgba(222,60,60,0)'); g.fillStyle = rg; g.fillRect(x - r, y - r, 2 * r, 2 * r); }

// ---------- scene 1: paper clip ----------
function bendV(t, list, amp) { let v = 0, prev = 0; list.forEach((tk, k) => { const tg = (k % 2 ? -1 : 1) * amp; v += (tg - prev) * spring(t - tk, 22, .6); prev = tg; }); return v; }
function sClip(t) {
  const cx = 960, cy = 540, n = TL.bends.filter(b => t >= b).length + (t >= TL.snap ? 1 : 0);
  const v = bendV(t, TL.bends, 220);
  if (t < TL.snap) {
    heat(cx, cy + v, 90 + n * 8, Math.min(1, .1 + n * .07));
    tube([[150, cy], [cx, cy + v], [1770, cy]], 34);
  } else {   // snapped: two halves fall apart
    const d = t - TL.snap, f = eo(d / .8), last = (TL.bends.length % 2 ? -1 : 1) * 0;
    heat(cx, cy, 160, clamp(1 - d / 2.5));
    g.save(); g.translate(cx - 30 * f, cy + 40 * f); g.rotate(-.12 * f); tube([[150 - cx, 0], [-6, 0]], 34); g.restore();
    g.save(); g.translate(cx + 30 * f, cy + 40 * f); g.rotate(.12 * f); tube([[6, 0], [1770 - cx, 0]], 34); g.restore();
    if (d < .25) { g.fillStyle = `rgba(198,47,58,${.15 * (1 - d / .25)})`; g.fillRect(0, 0, W, H); }
  }
  // counter
  const k = 1 + .2 * (1 - spring(t - (n ? (n > TL.bends.length ? TL.snap : TL.bends[n - 1]) : 0), 22, .55));
  if (n) { g.save(); g.translate(1700, 220); g.scale(k, k);
  txt(`第 ${n} 下`, 0, 0, 64, t >= TL.snap ? C.red : C.ink, 'right', 700, 1, SERIF); g.restore(); }
  // force bars: equal heights
  txt('每一下用的力', 210, 790, 24, C.grey, 'left', 500, ss(1.0, 1.4, t));
  TL.bends.forEach((b, i) => { if (t < b) return; const h = 70 * spring(t - b, 20, .7); g.fillStyle = C.blue; g.fillRect(210 + i * 26, 900 - h, 16, h); });
  if (t >= TL.snap) { const h = 70 * spring(t - TL.snap, 20, .7); g.fillStyle = C.red; g.fillRect(210 + 13 * 26, 900 - h, 16, h); }
  caption(t, '一根回形针，来回掰', -1, 4.6);
  caption(t, '每一下，用的力{都一样}', 4.7, 8.9);
  caption(t, '第 14 下，它[断]了', 9.2, 11.9);
  caption(t, '那到底，是哪一下把它掰断的——', 12.0, 16.8);
}
function sClimax1(t) {
  const d = t - 16.8, k = 1 + .5 * (1 - spring(d, 10, .9));
  g.save(); g.translate(W / 2, 470); g.scale(k, k); txt('最后一下', 0, 0, 230, C.ink, 'center', 900, 1, SERIF); g.restore();
  if (d < .9) { g.save(); g.strokeStyle = `rgba(198,47,58,${.6 * (1 - d / .9)})`; g.lineWidth = 5; g.beginPath(); g.arc(W / 2, 470, 140 + 900 * eo(d / .9), 0, Math.PI * 2); g.stroke(); g.restore(); }
  txt('和第一下，{一样轻}', W / 2, 720, 72, C.ink, 'center', 600, ss(17.3, 17.6, t), SERIF);
}
// ---------- scene 2: inside the metal ----------
function grains(x0, y0, w, h, a) {
  const s = 64, cols = Math.ceil(w / (s * 1.5)) + 2, rows = Math.ceil(h / (s * .87)) + 2;
  const V = (i, j) => [x0 + i * s * .75 + (rnd(i * 91 + j * 7) - .5) * s * .5, y0 + j * s * .5 + (rnd(i * 13 + j * 57) - .5) * s * .35];
  g.save(); g.globalAlpha *= a; g.beginPath(); g.rect(x0, y0, w, h); g.clip();
  for (let i = -1; i < cols * 2; i++) for (let j = -1; j < rows * 2; j++) {
    if ((i + j) % 2) continue; const p = [V(i, j), V(i + 1, j + 1), V(i + 1, j + 3), V(i, j + 4), V(i - 1, j + 3), V(i - 1, j + 1)];
    g.beginPath(); p.forEach(([x, y], k) => k ? g.lineTo(x, y) : g.moveTo(x, y)); g.closePath();
    const l = 198 + Math.floor(rnd(i * 3 + j * 17) * 34); g.fillStyle = `rgb(${l - 8},${l - 4},${l})`; g.fill();
    g.strokeStyle = 'rgba(70,78,90,.45)'; g.lineWidth = 2; g.stroke(); }
  g.restore();
}
function crackPts(x, y, len, seed) { const pts = [[x, y]]; let cx = x, cy = y; const n = 14;
  for (let i = 1; i <= n; i++) { cx += (rnd(seed + i) - .5) * 60; cy += len / n; pts.push([cx, cy]); } return pts; }
function drawCrack(pts, frac, a = 1, w = 5) {
  if (frac <= 0) return; const n = pts.length - 1, m = frac * n, k = Math.floor(m);
  g.save(); g.globalAlpha *= a; g.strokeStyle = '#2a1416'; g.lineWidth = w; g.lineJoin = 'miter'; g.beginPath(); g.moveTo(...pts[0]);
  for (let i = 1; i <= k; i++) g.lineTo(...pts[i]);
  let tip = pts[k]; if (k < n) { const f = m - k; tip = [lerp(pts[k][0], pts[k + 1][0], f), lerp(pts[k][1], pts[k + 1][1], f)]; g.lineTo(...tip); }
  g.stroke(); g.restore(); heat(tip[0], tip[1], 70, a); return tip;
}
function sMetal(t) {
  const a = ss(19.2, 19.8, t), z = .85 + .15 * eo((t - 19.2) / 1.2);
  g.save(); g.translate(730, 540); g.scale(z, z); g.translate(-730, -540);
  grains(160, 200, 1140, 640, a);
  g.fillStyle = `rgba(28,32,39,${.75 * a})`; g.fillRect(160, 196, 1140, 6);
  const done = TL.pulses.filter(p => t >= p).length;
  const grow = done ? (done - 1 + spring(t - TL.pulses[done - 1], 14, .8)) / 16 : 0;
  drawCrack(crackPts(730, 200, 560, 5), grow, a);
  // load arrows (push-pull each pulse)
  TL.pulses.forEach(p => { const d = t - p; if (d < 0 || d > 1.2) return; const s = Math.sin(Math.PI * d / 1.2);
    [[120, 1], [1340, -1]].forEach(([x, dir]) => { g.save(); g.strokeStyle = `rgba(198,47,58,${.8 * s})`; g.fillStyle = g.strokeStyle; g.lineWidth = 6;
      const x1 = x + dir * 30 * s; g.beginPath(); g.moveTo(x1 - dir * 60, 520); g.lineTo(x1, 520); g.stroke();
      g.beginPath(); g.moveTo(x1, 520); g.lineTo(x1 - dir * 18, 508); g.lineTo(x1 - dir * 18, 532); g.fill(); g.restore(); }); });
  g.restore();
  txt(`反复受力 第 ${done} 次`, 200, 160, 30, C.grey, 'left', 600, a);
  // gauge
  const ga = ss(21.4, 21.9, t), base = 820;
  if (ga > 0) { g.save(); g.globalAlpha = ga;
    g.fillStyle = '#c3c8d0'; g.fillRect(1440, base - 520, 110, 520); txt('一次能扛住的力', 1495, base + 36, 26, C.grey, 'center', 600);
    const pul = TL.pulses.reduce((p, q) => p + Math.max(0, Math.sin(Math.PI * clamp((t - q) / 1.2))), 0);
    const h = 120 + 20 * pul; g.fillStyle = C.blue; g.fillRect(1640, base - h, 110, h); txt('每一下的力', 1695, base + 36, 26, C.blue, 'center', 600);
    g.restore(); }
  caption(t, '放大到金属内部', 19.4, 21.5);
  caption(t, '每一下的力，都{远小于}它一次能扛住的', 21.7, 26.3);
  caption(t, '可每一下，都在里面留下[一点点伤]', 26.4, 31.1);
  caption(t, '伤口，会自己一点点往前长', 31.2, 33.5);
  const la = win(t, 33.6, 40.8, .25);
  if (la > 0) { g.save(); g.fillStyle = `rgba(238,241,245,${.82 * la})`; g.fillRect(0, 880, W, 160); g.restore();
    txt('这叫：[金属疲劳]', W / 2, 935, 70, C.ink, 'center', 800, la, SERIF);
    txt('反复受力 → 微裂纹 → 裂纹一点点长 → 断', W / 2, 1005, 30, C.grey, 'center', 500, ss(35.0, 35.4, t) * la); }
}
// ---------- scene 3: S-N curve ----------
function sSN(t) {
  const x0 = 360, y0 = 820, w = 1200, h = 560, a = ss(40.8, 41.3, t);
  g.save(); g.globalAlpha = a; g.strokeStyle = C.ink; g.lineWidth = 3; g.beginPath(); g.moveTo(x0, y0 - h - 20); g.lineTo(x0, y0); g.lineTo(x0 + w + 20, y0); g.stroke();
  txt('每一下的力', x0 - 20, y0 - h - 50, 28, C.grey, 'left', 600); txt('能撑住的次数 →', x0 + w, y0 + 40, 28, C.grey, 'right', 600);
  const curve = x => .92 - .62 * Math.pow(x, .55);           // aluminium-like: keeps falling
  const steel = x => Math.max(.92 - .62 * Math.pow(x, .55), .52);
  const p = ss(41.2, 44.8, t);
  g.lineWidth = 6; g.strokeStyle = C.blue; g.beginPath();
  for (let i = 0; i <= 100 * p; i++) { const x = i / 100; const X = x0 + x * w, Y = y0 - curve(x) * h; i ? g.lineTo(X, Y) : g.moveTo(X, Y); } g.stroke();
  [.08, .3, .6].forEach((x, i) => { const ta = 41.6 + i * 1.0; if (t < ta) return; const s = spring(t - ta, 18, .5);
    g.fillStyle = C.red; g.beginPath(); g.arc(x0 + x * w, y0 - curve(x) * h, 12 * s, 0, Math.PI * 2); g.fill(); });
  const sa = ss(45.8, 46.4, t);
  if (sa > 0) { g.globalAlpha = a * sa; g.setLineDash([12, 12]); g.strokeStyle = C.light; g.lineWidth = 4; g.beginPath();
    for (let i = 0; i <= 100; i++) { const x = i / 100; const X = x0 + x * w, Y = y0 - steel(x) * h; i ? g.lineTo(X, Y) : g.moveTo(X, Y); } g.stroke(); g.setLineDash([]);
    txt('钢：低到一定程度就扛得住', x0 + w - 10, y0 - .52 * h - 30, 26, C.grey, 'right', 600);
    txt('铝合金：一直往下，没有安全线', x0 + w - 10, y0 - curve(1) * h + 40, 28, C.blue, 'right', 700); }
  g.restore();
  caption(t, '力越小，能撑住的次数越多', 41.0, 45.5);
  caption(t, '可飞机用的铝合金：力再小，次数够多，[也会断]', 45.6, 50.4, 960, 50);
}
// ---------- scene 4: Comet ----------
function jet(x, y, s, a = 1, split = 0) {
  g.save(); g.globalAlpha *= a; g.translate(x, y); g.scale(s, s);
  const half = (side) => { g.save(); if (split) { g.translate(side * 40 * split, 30 * split * (side > 0 ? 1 : .5)); g.rotate(side * .15 * split); }
    g.fillStyle = '#b8bec8'; g.strokeStyle = C.steelD; g.lineWidth = 3;
    g.beginPath(); g.save(); g.rect(side < 0 ? -400 : 0, -200, 400, 400); g.clip();
    g.beginPath(); g.moveTo(-330, 0); g.quadraticCurveTo(-330, -34, -280, -34); g.lineTo(300, -30); g.quadraticCurveTo(360, -20, 370, 0); g.quadraticCurveTo(360, 22, 300, 30); g.lineTo(-280, 34); g.quadraticCurveTo(-330, 34, -330, 0); g.fill(); g.stroke();
    g.beginPath(); g.moveTo(-40, 20); g.lineTo(-150, 150); g.lineTo(-90, 150); g.lineTo(60, 24); g.closePath(); g.fill(); g.stroke();
    g.beginPath(); g.moveTo(-270, -30); g.lineTo(-330, -110); g.lineTo(-290, -110); g.lineTo(-220, -30); g.closePath(); g.fill(); g.stroke();
    g.fillStyle = C.steelD; for (let i = 0; i < 10; i++) g.fillRect(-200 + i * 48, -14, 20, 16);
    g.restore(); g.restore(); };
  half(-1); half(1); g.restore();
}
function sComet(t) {
  const yr = t < 55.2 ? '1952' : '1954', ya = ss(50.4, 50.8, t), yk = t >= 55.2 ? 1 + .3 * (1 - spring(t - 55.2, 18, .6)) : 1;
  g.save(); g.translate(200, 230); g.scale(yk, yk); txt(yr, 0, 0, 120, C.ink, 'left', 800, ya, SERIF); g.restore();
  const fly = eo((t - 50.4) / 4), x = lerp(-300, 980, fly), split = ss(TL.crash1, TL.crash1 + .6, t);
  jet(x, 520, 1.25, 1, split);
  [[TL.crash1, '1 月 · 厄尔巴岛附近', 1350, 380], [TL.crash2, '4 月 · 那不勒斯附近', 1350, 470]].forEach(([tc, s, X, Y]) => {
    if (t < tc) return; const k = spring(t - tc, 18, .55); g.save(); g.translate(X, Y); g.scale(k, k);
    g.strokeStyle = C.red; g.lineWidth = 8; g.beginPath(); g.moveTo(-18, -18); g.lineTo(18, 18); g.moveTo(18, -18); g.lineTo(-18, 18); g.stroke(); g.restore();
    txt(s, X + 40, Y, 34, C.ink, 'left', 600, clamp((t - tc) / .2)); });
  caption(t, '世界上第一种投入航线的喷气客机：{彗星}', 50.6, 55.0);
  caption(t, '三个月里，两架在高空[解体]', 55.4, 59.9);
}
// ---------- scene 5: water tank ----------
function fuselage(cx, cy, s, inflate, crack, a = 1) {
  g.save(); g.globalAlpha *= a; g.translate(cx, cy); g.scale(1, 1 + inflate * .06);
  g.fillStyle = '#c9ced6'; g.strokeStyle = C.steelD; g.lineWidth = 4;
  g.beginPath(); g.roundRect(-520 * s, -110 * s, 1040 * s, 220 * s, 110 * s); g.fill(); g.stroke();
  for (let i = 0; i < 12; i++) { g.fillStyle = '#5b6370'; g.beginPath(); g.roundRect((-430 + i * 72) * s, -30 * s, 36 * s, 40 * s, 4 * s); g.fill(); }
  // hatch cutout (near-square, small corner radius)
  const hx = -470 * s, hy = -80 * s; g.fillStyle = '#3b424d'; g.beginPath(); g.roundRect(hx, hy, 70 * s, 120 * s, 4 * s); g.fill();
  heat(hx + 70 * s, hy, 80 * s + 60 * crack, .2 + .8 * crack);
  if (crack > .02) drawCrack([[hx + 70 * s, hy], [hx + 110 * s, hy - 40 * s], [hx + 150 * s, hy - 60 * s], [hx + 210 * s, hy - 95 * s]], clamp((crack - .7) / .3), 1, 6);
  g.restore();
}
function sTank(t) {
  const a = ss(60.0, 60.5, t), d = t - TL.tank, cyc = d > 0 ? .5 - .5 * Math.cos(2 * Math.PI * Math.min(d, 9.6) / 1.2) : 0;
  const zoom = 1 + .9 * ss(70.4, 72.6, t), zx = 960 - 470 * .9 + 70 * .9, zy = 520 - 80 * .9;
  g.save(); g.globalAlpha = a; g.translate(zx, zy); g.scale(zoom, zoom); g.translate(-zx, -zy);
  g.fillStyle = 'rgba(80,140,200,.18)'; g.strokeStyle = 'rgba(40,86,163,.5)'; g.lineWidth = 4; g.beginPath(); g.roundRect(320, 300, 1280, 470, 20); g.fill(); g.stroke();
  for (let i = 0; i < 8; i++) { const by = 760 - ((t * 60 + rnd(i) * 400) % 450); g.fillStyle = 'rgba(255,255,255,.5)'; g.beginPath(); g.arc(380 + rnd(i * 7) * 1160, by, 6 + rnd(i * 3) * 6, 0, Math.PI * 2); g.fill(); }
  const crack = clamp(Math.pow(clamp(d / 9.6), 3)) * .7 + (t >= TL.tankEnd ? .3 * ss(TL.tankEnd, TL.tankEnd + .5, t) : 0);
  fuselage(960, 535, .9, cyc, crack);
  g.restore();
  const n = t < TL.tankEnd ? Math.round(1221 + 1836 * Math.pow(clamp(d / 9.6), 2)) : 3057;
  txt('累计起降（含真飞 1221 次）', 1600, 200, 28, C.grey, 'right', 600, a);
  txt(n + ' 次', 1600, 250, 60, t >= TL.tankEnd ? C.red : C.ink, 'right', 800, a, SERIF);
  txt('近似方形开口的拐角', 960, 250, 34, C.red, 'center', 700, ss(71.0, 71.4, t) * win(t, 71.0, 74.3));
  caption(t, '把一整段机身，{泡进水槽}', 60.2, 64.7);
  caption(t, '加压、泄压，一遍遍模拟{起降}', 64.8, 69.5);
  caption(t, '累计 3057 次起降，机身[裂开]了', 69.8, 74.3);
  caption(t, '压垮它的，不是哪一次飞行——', 74.4, 79.2);
  sourceTag('FAA Lessons Learned：de Havilland DH-106 Comet 1（G-ALYP / G-ALYY）', win(t, 60.2, 79.2));
}
function sClimax2(t) {
  const d = t - 79.2, k = 1 + .5 * (1 - spring(d, 10, .9));
  g.save(); g.translate(W / 2, 500); g.scale(k, k); txt('是[每一次]起落', 0, 0, 200, C.ink, 'center', 900, 1, SERIF); g.restore();
  if (d < .9) { g.save(); g.strokeStyle = `rgba(198,47,58,${.6 * (1 - d / .9)})`; g.lineWidth = 5; g.beginPath(); g.arc(W / 2, 500, 160 + 900 * eo(d / .9), 0, Math.PI * 2); g.stroke(); g.restore(); }
}

const SCENES = [[0, 16.8, sClip], [16.8, 19.2, sClimax1], [19.2, 40.8, sMetal], [40.8, 50.4, sSN], [50.4, 60.0, sComet], [60.0, 79.2, sTank],
